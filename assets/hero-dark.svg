<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-labelledby="t d">
  <title id="t">cmdscope previews shell command impact</title>
  <desc id="d">The raw agent command 'npm run clean &amp;&amp; npm run build' is statically analyzed into staged effects: stage 1 deletes build/** (conditional, from package.json scripts.clean) and stage 2 has a blocking unknown dynamic_path. Nothing is executed and no allow/deny decision is made.</desc>
  <style>
    .sans{font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
    .mono{font-family:'SF Mono',Menlo,Monaco,Cascadia Mono,Consolas,monospace}
    .cap{font-size:11px;font-weight:600;letter-spacing:1.4px;fill:#8b949e}
    .muted{font-size:12px;fill:#8b949e}
    .title{font-size:15px;font-weight:600;fill:#e6edf3}
    .cmd{font-size:20px;font-weight:500;fill:#e6edf3}
    .cmd-s{font-size:14px;font-weight:500;fill:#e6edf3}
    .fx{font-size:13px;font-weight:600}
    .panel{fill:#161b22;stroke:#30363d}
    .chip{fill:#4493f8}
    .tagbg{fill:#3d2e00;stroke:#9e6a03}
    .tagtx{fill:#d29922}
    .amp{fill:#4493f8}
    .red{fill:#ff7b72}
    .footbg{fill:#161b22;stroke:#30363d}
  </style>

  <!-- left: raw command -->
  <rect class="panel" x="16" y="20" width="370" height="200" rx="10"/>
  <text class="cap sans" x="36" y="48">Agent command · raw string</text>
  <text class="cmd mono" x="36" y="92">npm run clean<tspan class="amp"> &amp;&amp; </tspan></text>
  <text class="cmd mono" x="36" y="122">npm run build</text>
  <line x1="36" y1="143" x2="366" y2="143" stroke="#21262d" stroke-width="1"/>
  <text class="muted sans" x="36" y="167">Exactly what the agent wants to run.</text>
  <text class="muted sans" x="36" y="185">No expansion, no execution.</text>

  <!-- between-panels labels -->
  <text class="title sans" x="460" y="62" text-anchor="middle" fill="#4493f8">cmdscope</text>
  <text class="muted sans" x="460" y="82" text-anchor="middle">static analysis</text>
  <text class="muted sans" x="460" y="100" text-anchor="middle">no execution</text>

  <!-- arrow -->
  <line x1="398" y1="116" x2="496" y2="116" stroke="#4493f8" stroke-width="3"/>
  <path d="M496 108 L506 116 L496 124 Z" fill="#4493f8"/>

  <!-- right: impact preview -->
  <rect class="panel" x="534" y="20" width="330" height="200" rx="10"/>
  <text class="cap sans" x="554" y="48">Impact preview · staged &amp; evidenced</text>

  <circle class="chip" cx="562" cy="84" r="10"/>
  <text x="562" y="88" text-anchor="middle" font-size="11px" font-weight="700" fill="#0d1117" class="mono">1</text>
  <text class="cmd-s mono" x="582" y="89">npm run clean</text>
  <text class="fx mono red" x="554" y="118">— delete</text>
  <text class="fx mono" x="619" y="118" fill="#e6edf3">build/**</text>
  <rect class="tagbg" x="706" y="106" width="76" height="18" rx="9"/>
  <text class="tagtx sans" x="744" y="119" text-anchor="middle" font-size="10px" font-weight="600">conditional</text>

  <circle cx="562" cy="150" r="10" fill="#484f58"/>
  <text x="562" y="154" text-anchor="middle" font-size="11px" font-weight="700" fill="#0d1117" class="mono">2</text>
  <text class="cmd-s mono" x="582" y="155" fill="#e6edf3">npm run build</text>
  <text class="fx mono" x="554" y="184" fill="#d29922">? dynamic_path</text>
  <rect class="tagbg" x="706" y="172" width="76" height="18" rx="9"/>
  <text class="tagtx sans" x="744" y="185" text-anchor="middle" font-size="10px" font-weight="600">unknown</text>

  <!-- footer -->
  <rect class="footbg" x="16" y="244" width="848" height="40" rx="10"/>
  <text x="440" y="268" text-anchor="middle" font-size="13px" font-weight="500" fill="#e6edf3" class="sans">
    policy-neutral · never executes the command · no network · no allow/deny
  </text>
</svg>